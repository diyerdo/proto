// Jobs service difinition
syntax = "proto3";

package jobs.v1;

option go_package = "github.com/diyerdo/proto/go/jobs/v1;jobs";

service JobsService {
  // GetJobForItem returns the job required to craft the given item
  rpc GetJobForItem(GetJobForItemRequest) returns (GetJobForItemResponse);

  // GetJobRequirementsForItem returns the job requirements to craft the given item
  rpc GetJobsRequirementsForItem(GetJobsRequirementsForItemRequest) returns (GetJobsRequirementsForItemResponse);
}

// GetJobForItemRequest is the request for GetJobForItem
message GetJobForItemRequest {
  int32 item_id = 1;
}

enum Job {
  JOB_UNSPECIFIED = 0;
  JOB_ALCHEMIST = 1;
  JOB_CARVER = 2;
  JOB_FARMER = 3;
  JOB_FISHERMAN = 4;
  JOB_HANDYMAN = 5;
  JOB_HUNTER = 6;
  JOB_JEWELLER = 7;
  JOB_LUMBERJACK = 8;
  JOB_MINER = 9;
  JOB_SHIELDMAKER = 10;
  JOB_SHOEMAKER = 11;
  JOB_SMITH = 12;
  JOB_TAILOR = 13;
}

message JobRequirements {
  Job job = 1;
  int32 level = 2;
}

// GetJobForItemResponse is the response for GetJobForItem
message GetJobForItemResponse {
  repeated Job jobs = 1;
}

message GetJobsRequirementsForItemRequest {
  int32 item_id = 1;
}

message GetJobsRequirementsForItemResponse {
  repeated JobRequirements job_requirements = 1;
}
