// Equipment item lookup service definition
syntax = "proto3";

option go_package = "github.com/diyerdo/proto/go/equipment_item_lookup/v1;equipment_item_lookup";

// EquipmentItemLookupService is the service for equipment item lookup
service EquipmentItemLookupService {
  // Returns the equipment item from the name and category
  rpc GetEquipmentItemFromNameAndCategory(GetEquipmentItemFromNameAndCategoryRequest) returns (GetEquipmentItemFromNameAndCategoryResponse);
}

// EquipmentItemCategory represents the category of the equipment item to look up
enum EquipmentItemCategory {
  EQUIPMENT_ITEM_CATEGORY_UNSPECIFIED = 0;
  EQUIPMENT_ITEM_CATEGORY_BOOTS = 1;
}

message EquipmentItem {}

message GetEquipmentItemFromNameAndCategoryRequest {
  string name = 1;
  EquipmentItemCategory category = 2;
}

message GetEquipmentItemFromNameAndCategoryResponse {
  optional EquipmentItem equipment_item = 1;
}
